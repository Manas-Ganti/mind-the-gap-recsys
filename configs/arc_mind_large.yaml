# MIND-large on a VT ARC OWL Genoa node (96 cores). Inherits the whole protocol from
# config.yaml; only machine settings change. Size driver_memory to the job's --mem after the
# MIND-small run's sacct MaxRSS is known.
extends: config.yaml

spark:
  master: "local[96]"
  driver_memory: 120g
  shuffle_partitions: 384

# Every split date, k, N, grid and seed lives here. Nothing is hardcoded in src/.
seed: 42

paths:
  raw_dir: data/raw            # contains MIND{variant}_train/ and MIND{variant}_dev/
  processed_dir: data/processed
  models_dir: data/models
  results_dir: results
  figures_dir: figures

data:
  variant: large               # large | small (small is for laptop iteration only)
  raw_splits: [train, dev]     # MIND test has no labels, so it is never ingested

spark:
  master: "local[*]"
  driver_memory: 10g
  shuffle_partitions: 64
  extra: {}

split:
  # MIND train covers 2019-11-09..14, dev covers 2019-11-15 (timestamps treated as UTC).
  temporal_cutoff: "2019-11-15 00:00:00"     # test = everything at or after this
  validation_cutoff: "2019-11-14 00:00:00"   # inner split of temporal train: tuning + ranker training
  random_test_fraction: null                 # null => match the temporal split's test fraction
  exclude_train_seen: true                   # never rank items the user already clicked in train
  history_policy: snapshot                   # see config.py; asserted in the split audit
  catalog: live                              # live = items shown on the click's day (same rule every split)
  max_eval_users: 20000
  max_val_users: 50000

eval:
  ks: [5, 10, 20, 50, 100]
  headline_k: 10
  n_negatives: 100
  negative_oversample: 2.0
  user_batch: 512
  tie_noise: 1.0e-9          # relative jitter = seeded random tie-breaking
  popularity_gamma: 0.5      # IPS weight 1/(pop+1)^gamma for debiased metrics
  bootstrap: 1000

retrieval:
  candidates_k: 200
  tuning_metric: ndcg@10     # full-catalog, user-level, on temporal_val
  tuning_users: 5000
  popular:
    window_hours: [0.5, 1, 2, 3, 6, 12, 24, 72, null]   # null = all time incl. pre-window history
  itemknn:
    # Widened 2026-10-12 after the first MIND-small tuning run put the best point on the grid
    # edge (neighbors=500, alpha=0.7) on temporal_val. Validation only; test never seen.
    neighbors: [50, 100, 200, 500, 1000, 2000]
    shrink: [0, 10, 50, 200]
    alpha: [0.3, 0.5, 0.7, 0.85, 1.0]        # 0.5 = cosine; asymmetric otherwise; [0,1] is the full range
  graph:                                     # RP3beta item graph
    neighbors: [100, 300, 1000, 2000]        # widened 2026-10-12: best was the top edge (300) on temporal_val
    alpha: [0.5, 0.8, 1.0]
    beta: [0.0, 0.2, 0.4, 0.6]
  two_tower:
    text_encoder: sentence-transformers/all-MiniLM-L6-v2   # frozen; never fine-tuned (CLAUDE.md decision 1)
    encode_batch_size: 256
    dim: 64
    history_len: 30
    temperature: [0.02, 0.05, 0.1, 0.2]     # widened 2026-10-12 after edge hits on temporal_val (0.05, then 0.1)
    lr: 1.0e-3
    weight_decay: 1.0e-5
    batch_size: 1024
    epochs: 3
    max_steps_per_epoch: 3000
    logq_correction: true
    device: cpu              # cpu: bit-reproducible with deterministic kernels (MPS is not); ARC is CPU-only

ranking:
  max_train_users: 50000
  valid_fraction: 0.2
  gbdt:
    num_boost_round: 1000
    early_stopping_rounds: 50
    params:
      objective: lambdarank
      metric: ndcg
      eval_at: [10]
      learning_rate: 0.05
      num_leaves: 63
      min_data_in_leaf: 100
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 1
      verbose: -1
  neural:
    hidden: [128, 64]
    dropout: 0.1
    lr: 1.0e-3
    epochs: 60                 # raised 2026-10-12: valid NDCG still rising at the old cap (20); early stopping ends it
    batch_users: 128
    patience: 3
    device: cpu

serve:
  k: 100
  n_queries: 5000
  n_latency_queries: 1000
  hnsw_m: 32
  ef_search: [16, 32, 64, 128, 256]
  ivf_nlist: 256
  nprobe: [1, 4, 16, 64]
